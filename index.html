<div class="app-wrapper">
  <div class="glass-container">
    <div class="timer-display" id="display">00:00:00</div>

    <div class="input-row" id="inputs">
      <div class="field">
        <label>HH</label>
        <input type="number" id="h" placeholder="00" min="0">
      </div>
      <div class="field">
        <label>MM</label>
        <input type="number" id="m" placeholder="25" min="0">
      </div>
      <div class="field">
        <label>SS</label>
        <input type="number" id="s" placeholder="00" min="0">
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn-main" onclick="toggleTimer()">Start Focus</button>
      <button class="btn-reset" onclick="resetTimer()">Reset</button>
    </div>

    <div class="music-box">
      <input type="text" id="ytUrl" placeholder="Paste YouTube link here...">
      <button onclick="loadMusic()" class="btn-load">Load Music</button>
      
      <div class="player-wrapper" id="playerArea">
        </div>
    </div>
  </div>
</div>
